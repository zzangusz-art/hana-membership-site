# Railway(Nixpacks) 빌드 설정
# better-sqlite3는 Node 22/24용 prebuilt 바이너리만 제공한다(Node 20용 없음).
# engines를 22.x로 고정해 prebuilt를 받게 하고, 혹시 내려받지 못할 때를 대비해
# node-gyp 소스 빌드에 필요한 도구를 함께 설치한다.
[phases.setup]
# chromium: 리포트용 전후 스크린샷·OG 썸네일(puppeteer-core). apt의 chromium은 우분투 snap 스텁이라 실행이 안 되므로 nix 패키지로 설치한다("..."는 기본 node 패키지 유지).
nixPkgs = ["...", "chromium"]
aptPkgs = ["python3", "build-essential", "fonts-noto-cjk"]
