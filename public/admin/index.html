<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>관리자 — 하나회원권거래소</title>
<link rel="icon" href="/img/icon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-box"><img src="/img/logo.png" alt="하나회원권거래소" width="220"><h1>관리자 로그인</h1><label>아이디 <input name="id" autocomplete="username" required></label><label>비밀번호 <input name="pw" type="password" autocomplete="current-password" required></label><button class="btn primary block" type="submit">로그인</button><p class="msg" id="loginMsg"></p></form>
</div>
<div id="app" hidden>
  <aside class="side">
    <a class="brand" href="/admin"><img src="/img/mark.png" alt="" width="30"><span>하나회원권 관리자</span></a>
    <nav id="menu">
      <a data-v="dash" class="active">📊 대시보드</a>
      <a data-v="prices">💹 시세 관리</a>
      <a data-v="clubs">⛳ 골프장 소개</a>
      <a data-v="posts">📝 콘텐츠(블로그)</a>
      <a data-v="auto">🤖 자동발행</a>
      <a data-v="listings">🏷️ 매물</a>
      <a data-v="inquiries">📨 문의 <b id="inqBadge" class="badge" hidden></b></a>
      <a data-v="notice">📢 공지·뉴스·유튜브</a>
      <a data-v="plan">📅 4주 실행계획</a>
      <a data-v="reports">📈 리포트</a>
      <a data-v="audit">🔍 기술 감사·방문</a>
      <a data-v="settings">⚙️ 설정</a>
    </nav>
    <div class="side-foot"><a href="/" target="_blank">홈페이지 열기 ↗</a><button id="logout" class="link">로그아웃</button></div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-box"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></div></div>
<script src="/admin/admin.js"></script>
</body>
</html>
